<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Seller Metrics{% endblock %}</title>
  <style>
    :root { --navy:#172554; --blue:#2563eb; --ink:#172033; --muted:#64748b; --bg:#f4f7fb; --card:#fff; --danger:#b91c1c; --warn:#9a6700; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial, sans-serif; }
    nav { background:var(--navy); color:#fff; padding:17px max(24px, calc((100% - 1120px)/2)); display:flex; justify-content:space-between; align-items:center; }
    nav a { color:#fff; text-decoration:none; font-weight:700; }
    .brand { font-size:1.15rem; } .nav-links { display:flex; gap:12px; }
    .button { background:var(--blue); color:#fff; border:0; border-radius:7px; padding:10px 14px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
    .button.secondary { background:#e6eefc; color:#1746a2; } .button.danger { background:var(--danger); padding:7px 10px; font-size:.8rem; }
    main { max-width:1120px; margin:32px auto; padding:0 20px; }
    h1 { margin:0 0 7px; } .subtitle { margin:0 0 24px; color:var(--muted); }
    .message { padding:12px 14px; margin:0 0 20px; border-radius:7px; background:#dcfce7; color:#166534; }
    .cards { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:24px; }
    .card, .panel { background:var(--card); border-radius:10px; box-shadow:0 2px 10px #0f172a10; padding:20px; }
    .card-label { color:var(--muted); font-size:.84rem; font-weight:700; text-transform:uppercase; } .metric { font-size:1.65rem; font-weight:700; margin-top:9px; }
    .grid { display:grid; grid-template-columns:2fr 1fr; gap:20px; } .panel h2 { margin-top:0; font-size:1.08rem; }
    table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:12px 8px; border-bottom:1px solid #e8edf5; } th { color:var(--muted); font-size:.75rem; text-transform:uppercase; }
    .low-stock { color:var(--warn); font-weight:700; } .empty { color:var(--muted); padding:14px 0; }
    .form-panel { max-width:600px; } label { display:block; margin:16px 0 6px; font-weight:700; } input, select { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; font:inherit; } .errorlist { color:var(--danger); margin:5px 0; padding-left:18px; }
    .form-actions { display:flex; gap:10px; margin-top:24px; }
    @media (max-width:760px) { .cards { grid-template-columns:repeat(2,1fr); } .grid { grid-template-columns:1fr; } nav { padding:17px 20px; } }
  </style>
</head>
<body>
  <nav><a class="brand" href="{% url 'dashboard' %}">Seller Metrics</a><div class="nav-links"><a class="button secondary" href="{% url 'product_create' %}">+ Product</a><a class="button" href="{% url 'sale_create' %}">+ Record Sale</a></div></nav>
  <main>{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
</body>
</html>
